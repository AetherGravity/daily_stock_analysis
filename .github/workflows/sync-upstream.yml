name: Sync Fork

on:
  schedule:
    - cron: '0 2 * * *'  # 每天台灣時間早上10點
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/ZhuLinsen/daily_stock_analysis.git
          git fetch upstream
          git checkout main
          git merge upstream/main --allow-unrelated-histories -m "chore: sync upstream"
          git push origin main
